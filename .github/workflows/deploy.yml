# FinExcel-PS · Version E — puts the add-in online with GitHub Pages.
# Runs every time finexcel-ps-e-site.zip (or this file) changes on main.
name: Deploy add-in

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Unpack the add-in and point its manifest at this site
        run: |
          mkdir site
          unzip -q "$(find . -name finexcel-ps-e-site.zip | head -1)" -d site
          BASE="${{ steps.pages.outputs.base_url }}"
          ORIGIN="${{ steps.pages.outputs.origin }}"
          sed -i "s#https://pages-base-url.invalid/#${BASE}/#g; s#https://pages-base-url.invalid#${ORIGIN}#g" site/manifest.xml
          echo "Manifest for Excel: ${BASE}/manifest.xml"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
